# Validates the gfs Helm chart on PRs and pushes that touch the chart.
name: Helm chart

on:
  pull_request:
    paths:
      - "run/kubernetes/helm/**"
      - ".github/workflows/helm-lint.yml"
  push:
    branches: [main, develop]
    paths:
      - "run/kubernetes/helm/**"
      - ".github/workflows/helm-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  KUBECONFORM_VERSION: v0.7.0
  KUBERNETES_VERSION: "1.30.0"

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CHART_DIR: run/kubernetes/helm/gfs
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz
          sudo mv kubeconform /usr/local/bin/
          kubeconform -v

      - name: helm lint
        run: helm lint "$CHART_DIR"

      - name: helm template + kubeconform (inline bootstrap)
        run: |
          helm template test-rel "$CHART_DIR" --namespace test-ns \
            --set bootstrap.admin=lab-admin \
            --set bootstrap.password=lab-password-ok | \
            kubeconform -strict -kubernetes-version "${KUBERNETES_VERSION}" -summary -

      - name: helm template + kubeconform (existing Secret)
        run: |
          helm template test-rel "$CHART_DIR" --namespace test-ns \
            --set bootstrap.existingSecret=gfs-bootstrap | \
            kubeconform -strict -kubernetes-version "${KUBERNETES_VERSION}" -summary -

      - name: helm template + kubeconform (vps-s3)
        run: |
          helm template test-rel "$CHART_DIR" --namespace test-ns \
            --set bootstrap.existingSecret=gfs-bootstrap \
            --set topology=vps-s3 \
            --set s3.bucket=captures \
            --set s3.existingSecret=gfs-s3 | \
            kubeconform -strict -kubernetes-version "${KUBERNETES_VERSION}" -summary -
